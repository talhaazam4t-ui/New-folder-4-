# Production-mode local container verification & generic container host compose config.
# Builds the unified root Dockerfile (Next.js static export + FastAPI on $PORT).
# Live production hosts use root `Dockerfile` directly via `render.yaml` (Render,
# primary host for https://teloxtech.stream) and `railway.toml` (Railway, secondary host).
# For local development with hot-reload mount on port 8000, use `docker-compose.yml`.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talox_backend_prod
    restart: always
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - PORT=${PORT:-10000}
      - HOST=0.0.0.0
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${PORT:-10000}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
