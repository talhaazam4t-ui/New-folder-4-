services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talox_backend_prod
    restart: always
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 450M
        reservations:
          memory: 200M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: talox_caddy_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  caddy_data:
  caddy_config:
