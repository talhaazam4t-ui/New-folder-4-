# ==============================================================================
# Google Cloud Build Pipeline for Talox Tech Stream (Region: me-central1)
# Builds and deploys:
#   1. FastAPI Backend (`talox-backend`) from root `Dockerfile`
#   2. Next.js 14 Frontend (`talox-frontend`) from `frontend/Dockerfile`
# ==============================================================================

substitutions:
  _REGION: me-central1
  _AR_REPO: talox-repo
  _BACKEND_SERVICE: talox-backend
  _FRONTEND_SERVICE: talox-frontend
  _BACKEND_PUBLIC_URL: https://api.example.com
  _FRONTEND_PUBLIC_URL: https://example.com
  _SUPABASE_URL: https://pmmduhflikdvddzpgwsi.supabase.co

steps:
  # 1. Build FastAPI Backend Docker Image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_SERVICE}:${SHORT_SHA}"
      - "-f"
      - "Dockerfile"
      - "."

  # 2. Push FastAPI Backend Image to Artifact Registry (me-central1)
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    waitFor: ["build-backend"]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_SERVICE}:${SHORT_SHA}"

  # 3. Deploy FastAPI Backend to Cloud Run (me-central1) with Secret Manager bindings
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    waitFor: ["push-backend"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_BACKEND_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_SERVICE}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8000"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--set-env-vars=APP_ENV=production,DEBUG=false,SUPABASE_URL=${_SUPABASE_URL},FRONTEND_URL=${_FRONTEND_PUBLIC_URL},BACKEND_URL=${_BACKEND_PUBLIC_URL}"
      - "--set-secrets=APP_SECRET_KEY=TALOX_APP_SECRET_KEY:latest,SUPABASE_ANON_KEY=TALOX_SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=TALOX_SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=TALOX_SUPABASE_JWT_SECRET:latest,SUPABASE_DATABASE_URL=TALOX_SUPABASE_DATABASE_URL:latest,DEEPSEEK_API_KEY=TALOX_DEEPSEEK_API_KEY:latest"
      - "--quiet"

  # 4. Build Next.js 14 Frontend Docker Image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_FRONTEND_SERVICE}:${SHORT_SHA}"
      - "--build-arg"
      - "NEXT_PUBLIC_BACKEND_URL=${_BACKEND_PUBLIC_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}"
      - "-f"
      - "frontend/Dockerfile"
      - "frontend"

  # 5. Push Next.js 14 Frontend Image to Artifact Registry (me-central1)
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    waitFor: ["build-frontend"]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_FRONTEND_SERVICE}:${SHORT_SHA}"

  # 6. Deploy Next.js 14 Frontend to Cloud Run (me-central1)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    waitFor: ["push-frontend", "deploy-backend"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_FRONTEND_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_FRONTEND_SERVICE}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=3000"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_BACKEND_URL=${_BACKEND_PUBLIC_URL},NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}"
      - "--set-secrets=NEXT_PUBLIC_SUPABASE_ANON_KEY=TALOX_SUPABASE_ANON_KEY:latest"
      - "--quiet"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_FRONTEND_SERVICE}:${SHORT_SHA}"
